name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate the reviewed source
        run: |
          make lint test e2e docs-check site-check
          go test -race ./...
          make vuln
          npm test --prefix build/npm
          make release-tests
      - name: Build and verify the release candidate
        run: |
          test "$TAG" = "v$(node -p "require('./build/npm/package.json').version")"
          make package
          make isolation-check
          python3 scripts/release-check.py --publish
      - name: Reconcile and publish the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --apply
